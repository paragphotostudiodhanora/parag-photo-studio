<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parag Photo Studio | Dhanora</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
}

/* ================= HEADER ================= */

header{
    height:90px;
    width:100%;
    background:#050505;
    border-bottom:2px solid #ffd000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:relative;
    z-index:20;
}

.logo h1{
    color:#ffd000;
    font-size:28px;
    font-weight:800;
    letter-spacing:2px;
}

.logo p{
    color:#fff;
    font-size:12px;
    font-weight:bold;
    letter-spacing:3px;
    margin-top:5px;
}

nav{
    display:flex;
    gap:35px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.menu-btn{
    display:none;
    width:55px;
    height:55px;
    border:3px solid #ffd000;
    border-radius:15px;
    color:#ffd000;
    font-size:30px;
    align-items:center;
    justify-content:center;
}

/* ================= HERO ================= */

.hero{
    width:100%;
    min-height:calc(100vh - 90px);
    background:#000;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* PHOTO */

.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    opacity:0;
    transition:opacity .7s ease;
}

.slide.active{
    opacity:1;
    z-index:1;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    background:#000;
}

/* DARK OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.42);
    z-index:2;
}

/* CONTENT */

.hero-content{
    position:relative;
    z-index:5;
    width:90%;
    max-width:900px;
    text-align:center;
}

.small-title{
    color:#ffd000;
    font-size:14px;
    font-weight:bold;
    letter-spacing:5px;
    margin-bottom:22px;
}

.hero h2{
    font-size:62px;
    line-height:1;
    font-weight:900;
    margin-bottom:25px;
}

.hero h2 span{
    color:#ffd000;
}

.hero-content p{
    max-width:780px;
    margin:0 auto 30px;
    font-size:18px;
    line-height:1.5;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:175px;
    padding:15px 25px;
    border-radius:40px;
    color:#fff;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}

.call{
    background:#ff2929;
}

.whatsapp{
    background:#12d65b;
}

.services{
    background:#ffd000;
    color:#000;
}

/* ARROWS */

.slider-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:50px;
    height:50px;
    border:2px solid #ffd000;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    color:#ffd000;
    font-size:30px;
    cursor:pointer;
}

#prev{
    left:20px;
}

#next{
    right:20px;
}

/* DOTS */

.dots{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:8px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#aaa;
    cursor:pointer;
}

.dot.active{
    width:24px;
    border-radius:10px;
    background:#ffd000;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    header{
        height:105px;
        padding:15px 28px;
    }

    .logo h1{
        font-size:34px;
        line-height:1.05;
        letter-spacing:1.5px;
        max-width:350px;
    }

    .logo p{
        font-size:11px;
        letter-spacing:2.5px;
        margin-top:7px;
    }

    nav{
        display:none;
    }

    .menu-btn{
        display:flex;
        flex-shrink:0;
    }

    .hero{
        min-height:calc(100vh - 105px);
        height:calc(100vh - 105px);
    }

    .slide img{
        width:100%;
        height:100%;
        object-fit:contain;
    }

    .hero-content{
        width:88%;
        max-width:600px;
        padding:20px 10px 70px;
    }

    .small-title{
        font-size:11px;
        letter-spacing:3px;
        margin-bottom:18px;
    }

    .hero h2{
        font-size:42px;
        line-height:1.05;
        margin-bottom:22px;
    }

    .hero-content p{
        font-size:16px;
        line-height:1.45;
        margin-bottom:25px;
    }

    .buttons{
        flex-direction:column;
        align-items:center;
        gap:12px;
        width:100%;
    }

    .btn{
        width:82%;
        min-width:0;
        padding:15px 18px;
        font-size:18px;
    }

    .slider-btn{
        width:52px;
        height:52px;
        font-size:30px;
    }

    #prev{
        left:15px;
    }

    #next{
        right:15px;
    }

    .dots{
        bottom:15px;
        gap:7px;
    }

    .dot{
        width:8px;
        height:8px;
    }

    .dot.active{
        width:22px;
    }
}

/* SMALL MOBILE */

@media(max-width:480px){

    header{
        height:105px;
        padding:15px 20px;
    }

    .logo h1{
        font-size:29px;
    }

    .logo p{
        font-size:10px;
        letter-spacing:2px;
    }

    .menu-btn{
        width:54px;
        height:54px;
        font-size:29px;
    }

    .hero{
        min-height:calc(100vh - 105px);
        height:calc(100vh - 105px);
    }

    .hero-content{
        padding:20px 5px 65px;
    }

    .small-title{
        font-size:10px;
        letter-spacing:2.5px;
        margin-bottom:16px;
    }

    .hero h2{
        font-size:35px;
        line-height:1.05;
        margin-bottom:18px;
    }

    .hero-content p{
        font-size:15px;
        line-height:1.45;
        margin-bottom:20px;
    }

    .btn{
        width:80%;
        padding:14px;
        font-size:17px;
    }

    .slider-btn{
        width:50px;
        height:50px;
        font-size:28px;
    }

    #prev{
        left:12px;
    }

    #next{
        right:12px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        <h1>PARAG PHOTO STUDIO</h1>
        <p>DHANORA • GADCHIROLI</p>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Wedding</a>
        <a href="#">Contact</a>
    </nav>

    <div class="menu-btn">
        ☰
    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <!-- PHOTO 1 -->
    <div class="slide active">
        <img src="1.jpg" alt="Parag Photo Studio">
    </div>

    <!-- PHOTO 2 -->
    <div class="slide">
        <img src="3.jpg" alt="Parag Photo Studio">
    </div>

    <!-- PHOTO 3 -->
    <div class="slide">
        <img src="4.JPG" alt="Parag Photo Studio">
    </div>

    <!-- PHOTO 4 -->
    <div class="slide">
        <img src="5.jpg" alt="Parag Photo Studio">
    </div>

    <div class="overlay"></div>


    <!-- CONTENT -->

    <div class="hero-content">

        <div class="small-title">
            ROYAL WEDDING • PORTRAIT • VIDEO
        </div>

        <h2>
            PARAG <span>PHOTO</span><br>
            STUDIO
        </h2>

        <p>
            Capturing your beautiful moments with premium photography,
            cinematic wedding films and creative pre-wedding photography.
        </p>

        <div class="buttons">

            <a class="btn call"
               href="tel:9405507553">
               📞 Call Now
            </a>

            <a class="btn whatsapp"
               href="https://wa.me/919359877572"
               target="_blank">
               💬 WhatsApp
            </a>

            <a class="btn services"
               href="#">
               View Services
            </a>

        </div>

    </div>


    <!-- ARROWS -->

    <button class="slider-btn" id="prev">
        ‹
    </button>

    <button class="slider-btn" id="next">
        ›
    </button>


    <!-- DOTS -->

    <div class="dots">

        <span class="dot active" data-slide="0"></span>
        <span class="dot" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
        <span class="dot" data-slide="3"></span>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script>

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

let current = 0;
let timer;


/* SHOW SLIDE */

function showSlide(index){

    if(index >= slides.length){
        index = 0;
    }

    if(index < 0){
        index = slides.length - 1;
    }

    slides.forEach(slide => {
        slide.classList.remove("active");
    });

    dots.forEach(dot => {
        dot.classList.remove("active");
    });

    slides[index].classList.add("active");
    dots[index].classList.add("active");

    current = index;
}


/* NEXT */

function nextSlide(){
    showSlide(current + 1);
}


/* PREVIOUS */

function prevSlide(){
    showSlide(current - 1);
}


/* BUTTONS */

document.getElementById("next").addEventListener("click", function(){
    nextSlide();
    restartTimer();
});

document.getElementById("prev").addEventListener("click", function(){
    prevSlide();
    restartTimer();
});


/* DOTS */

dots.forEach(dot => {

    dot.addEventListener("click", function(){

        const index = Number(this.dataset.slide);

        showSlide(index);

        restartTimer();

    });

});


/* AUTO SLIDE */

function startTimer(){

    timer = setInterval(function(){

        nextSlide();

    },5000);

}


/* RESTART */

function restartTimer(){

    clearInterval(timer);

    startTimer();

}


/* START */

startTimer();

</script>

</body>
</html>
