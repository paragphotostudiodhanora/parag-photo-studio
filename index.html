<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parag Photo Studio - Photo Slideshow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;font-family:Arial,sans-serif;overflow:hidden}
#slideshow{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s ease}
.slide.active{opacity:1}
.slide img{max-width:94%;max-height:88vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.7);border-radius:4px}
.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:18px 24px;text-align:center;
background:linear-gradient(rgba(0,0,0,.75),transparent);color:#fff}
.top h1{margin:0;font-size:24px;letter-spacing:3px}
.top p{margin:6px 0 0;font-size:13px;opacity:.85}
.nav{position:absolute;z-index:6;top:50%;transform:translateY(-50%);border:0;border-radius:50%;
width:48px;height:48px;background:rgba(255,255,255,.18);color:#fff;font-size:28px;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.35)}
.prev{left:18px}.next{right:18px}
.dots{position:absolute;z-index:6;bottom:25px;left:0;right:0;text-align:center}
.dot{display:inline-block;width:8px;height:8px;margin:0 4px;border-radius:50%;background:#777;cursor:pointer}
.dot.active{background:#fff}
.loading{color:#fff;font-size:18px}
@media(max-width:600px){.top h1{font-size:18px}.top p{font-size:11px}.nav{width:40px;height:40px;font-size:22px}}
</style>
</head>
<body>
<div id="slideshow">
  <div class="top">
    <h1>PARAG PHOTO STUDIO</h1>
    <p>DHANORA • WEDDING PHOTO GALLERY</p>
  </div>
  <div class="loading" id="loading">Loading photos...</div>
  <button class="nav prev" id="prev">‹</button>
  <button class="nav next" id="next">›</button>
  <div class="dots" id="dots"></div>
</div>

<script>
const owner="paragphotostudiodhanora";
const repo="parag-photo-studio";
const branch="main";
const root=`https://api.github.com/repos/${owner}/${repo}/contents/`;

let photos=[], current=0, timer;

async function loadPhotos(){
  try{
    const res=await fetch(root+"?ref="+branch);
    const files=await res.json();
    photos=files
      .filter(f=>f.type==="file" && /\.(jpe?g|png|webp)$/i.test(f.name))
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));

    const box=document.getElementById("slideshow");
    document.getElementById("loading").remove();

    if(!photos.length){
      const msg=document.createElement("div");
      msg.className="loading"; msg.textContent="No photos found.";
      box.appendChild(msg); return;
    }

    photos.forEach((p,i)=>{
      const s=document.createElement("div");
      s.className="slide"+(i===0?" active":"");
      const img=document.createElement("img");
      img.src=p.download_url;
      img.alt=p.name;
      img.loading=i===0?"eager":"lazy";
      s.appendChild(img);
      box.insertBefore(s,document.getElementById("prev"));
      const d=document.createElement("span");
      d.className="dot"+(i===0?" active":"");
      d.onclick=()=>show(i);
      document.getElementById("dots").appendChild(d);
    });
    start();
  }catch(e){
    document.getElementById("loading").textContent="Photos load nahi ho pa rahe. GitHub repository public hai kya?";
  }
}

function show(n){
  const slides=document.querySelectorAll(".slide");
  const dots=document.querySelectorAll(".dot");
  if(!slides.length)return;
  current=(n+slides.length)%slides.length;
  slides.forEach((s,i)=>s.classList.toggle("active",i===current));
  dots.forEach((d,i)=>d.classList.toggle("active",i===current));
}
function next(){show(current+1)}
function prev(){show(current-1)}
function start(){clearInterval(timer);timer=setInterval(next,4000)}

document.getElementById("next").onclick=()=>{next();start()};
document.getElementById("prev").onclick=()=>{prev();start()};
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){next();start()}
  if(e.key==="ArrowLeft"){prev();start()}
});
document.getElementById("slideshow").addEventListener("mouseenter",()=>clearInterval(timer));
document.getElementById("slideshow").addEventListener("mouseleave",start);
loadPhotos();
</script>
</body>
</html>
