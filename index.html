<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parag Photo Studio | Dhanora</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
}

body{
    overflow-x:hidden;
}

/* ================= HEADER ================= */

header{
    height:90px;
    background:#050505;
    border-bottom:1px solid #ffd000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:relative;
    z-index:20;
}

.logo h1{
    font-size:28px;
    color:#ffd000;
    font-weight:900;
    letter-spacing:2px;
}

.logo p{
    margin-top:4px;
    font-size:12px;
    font-weight:bold;
    letter-spacing:3px;
    color:#fff;
}

nav{
    display:flex;
    gap:35px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#ffd000;
}

.menu-btn{
    display:none;
    width:55px;
    height:55px;
    border:3px solid #ffd000;
    border-radius:12px;
    color:#ffd000;
    font-size:30px;
    background:none;
}

/* ================= HERO ================= */

.hero{
    width:100%;
    height:calc(100vh - 90px);
    min-height:650px;
    position:relative;
    overflow:hidden;
    background:#000;
}

.slides{
    position:absolute;
    inset:0;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 0.8s ease;
}

.slide.active{
    opacity:1;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

.slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.48);
}

/* ================= HERO CONTENT ================= */

.hero-content{
    position:absolute;
    z-index:5;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:900px;
    text-align:center;
}

.small-title{
    color:#ffd000;
    font-size:15px;
    font-weight:bold;
    letter-spacing:5px;
    margin-bottom:22px;
}

.hero h2{
    font-size:62px;
    line-height:1;
    font-weight:900;
    margin-bottom:25px;
}

.hero h2 span{
    color:#ffd000;
}

.hero-content p{
    max-width:800px;
    margin:0 auto 28px;
    font-size:18px;
    line-height:1.5;
}

/* ================= BUTTONS ================= */

.buttons{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:14px 28px;
    min-width:155px;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.call{
    background:#ff2b2b;
    color:#fff;
}

.whatsapp{
    background:#12d65b;
    color:#fff;
}

.services{
    background:#ffd000;
    color:#000;
}

/* ================= ARROWS ================= */

.slider-btn{
    position:absolute;
    z-index:10;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    border-radius:50%;
    border:2px solid #ffd000;
    background:rgba(0,0,0,0.35);
    color:#ffd000;
    font-size:30px;
    cursor:pointer;
}

#prev{
    left:18px;
}

#next{
    right:18px;
}

/* ================= DOTS ================= */

.dots{
    position:absolute;
    z-index:10;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#aaa;
    cursor:pointer;
}

.dot.active{
    width:22px;
    border-radius:10px;
    background:#ffd000;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    header{
        height:125px;
        padding:20px 35px;
        align-items:center;
    }

    .logo h1{
        font-size:36px;
        line-height:1.05;
        letter-spacing:1px;
    }

    .logo p{
        font-size:11px;
        letter-spacing:2.5px;
        margin-top:8px;
    }

    nav{
        display:none;
    }

    .menu-btn{
        display:block;
        flex-shrink:0;
    }

    .hero{
        height:calc(100vh - 125px);
        min-height:650px;
    }

    /*
       MOBILE PHOTO:
       Photo को पूरा दिखाने के लिए contain
    */
    .slide{
        display:flex;
        align-items:center;
        justify-content:center;
        background:#000;
    }

    .slide img{
        width:100%;
        height:100%;
        object-fit:contain;
        object-position:center;
        background:#000;
    }

    .hero::after{
        content:"";
        position:absolute;
        inset:0;
        background:rgba(0,0,0,0.18);
        z-index:2;
        pointer-events:none;
    }

    .hero-content{
        top:50%;
        width:92%;
        max-width:650px;
        padding:20px;
    }

    .small-title{
        font-size:12px;
        letter-spacing:3px;
        margin-bottom:20px;
    }

    .hero h2{
        font-size:42px;
        line-height:1.05;
        margin-bottom:22px;
    }

    .hero-content p{
        font-size:17px;
        line-height:1.45;
        margin-bottom:25px;
    }

    .buttons{
        width:100%;
        flex-direction:column;
        align-items:center;
        gap:12px;
    }

    .btn{
        width:82%;
        min-width:0;
        padding:15px 18px;
        font-size:18px;
    }

    .slider-btn{
        width:55px;
        height:55px;
        font-size:30px;
        top:63%;
    }

    #prev{
        left:15px;
    }

    #next{
        right:15px;
    }

    .dots{
        bottom:18px;
    }
}

/* ================= SMALL MOBILE ================= */

@media(max-width:480px){

    header{
        height:110px;
        padding:16px 22px;
    }

    .logo h1{
        font-size:30px;
        line-height:1.05;
    }

    .logo p{
        font-size:10px;
        letter-spacing:2px;
    }

    .menu-btn{
        width:54px;
        height:54px;
        font-size:28px;
    }

    .hero{
        height:calc(100vh - 110px);
        min-height:620px;
    }

    .hero-content{
        width:94%;
        padding:15px;
    }

    .small-title{
        font-size:10px;
        letter-spacing:2.5px;
        margin-bottom:16px;
    }

    .hero h2{
        font-size:35px;
        line-height:1.05;
        margin-bottom:18px;
    }

    .hero-content p{
        font-size:15px;
        line-height:1.45;
        margin-bottom:20px;
    }

    .btn{
        width:80%;
        padding:14px;
        font-size:17px;
    }

    .slider-btn{
        width:52px;
        height:52px;
        font-size:28px;
        top:63%;
    }

    #prev{
        left:10px;
    }

    #next{
        right:10px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        <h1>PARAG PHOTO STUDIO</h1>
        <p>DHANORA • GADCHIROLI</p>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#services">Services</a>
        <a href="#">Wedding</a>
        <a href="#">Contact</a>
    </nav>

    <button class="menu-btn">☰</button>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <div class="slides">

        <div class="slide active">
            <img src="1.jpg" alt="Parag Photo Studio">
        </div>

        <div class="slide">
            <img src="3.jpg" alt="Parag Photo Studio">
        </div>

        <div class="slide">
            <img src="4.JPG" alt="Parag Photo Studio">
        </div>

        <div class="slide">
            <img src="5.jpg" alt="Parag Photo Studio">
        </div>

    </div>


    <button class="slider-btn" id="prev">‹</button>
    <button class="slider-btn" id="next">›</button>


    <div class="hero-content">

        <div class="small-title">
            ROYAL WEDDING • PORTRAIT • VIDEO
        </div>

        <h2>
            PARAG <span>PHOTO</span><br>
            STUDIO
        </h2>

        <p>
            Capturing your beautiful moments with premium photography,
            cinematic wedding films and creative pre-wedding photography.
        </p>

        <div class="buttons">

            <a class="btn call"
               href="tel:9405507553">
               📞 Call Now
            </a>

            <a class="btn whatsapp"
               href="https://wa.me/919359877572"
               target="_blank">
               💬 WhatsApp
            </a>

            <a class="btn services"
               href="#services">
               View Services
            </a>

        </div>

    </div>


    <div class="dots">

        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script>

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

let current = 0;

function showSlide(index){

    if(index >= slides.length){
        current = 0;
    }
    else if(index < 0){
        current = slides.length - 1;
    }
    else{
        current = index;
    }

    slides.forEach((slide,i)=>{
        slide.classList.toggle("active", i === current);
    });

    dots.forEach((dot,i)=>{
        dot.classList.toggle("active", i === current);
    });
}

document.getElementById("next").addEventListener("click",()=>{
    showSlide(current + 1);
});

document.getElementById("prev").addEventListener("click",()=>{
    showSlide(current - 1);
});

dots.forEach((dot,index)=>{
    dot.addEventListener("click",()=>{
        showSlide(index);
    });
});

/* AUTO SLIDESHOW */

setInterval(()=>{
    showSlide(current + 1);
},5000);

</script>

</body>
</html>
